# Netlify Configuration for Tiger Realtors (https://tigerrealtors.in)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Routing: Redirect all client-side routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Best-Practice HTTP Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache Optimization for immutable Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.(png|jpg|jpeg|svg|webp|ico)"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
